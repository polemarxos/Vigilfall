<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>Vigilfall Admin</title>
<style>
:root{--bg:#14110d;--panel:#1f1a14;--panel2:#2a231a;--line:#3d3324;--text:#eadfc8;--dim:#a99878;--gold:#e8b85a;--good:#7ccf8a;--bad:#ff6a5a;--blue:#8fc4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#1c1711,#14110d);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;color:var(--gold);letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:0 0 auto}.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}.dot.off{background:var(--bad)}
main{padding:12px;max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#100d0a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:9px 0 8px;font-size:11px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400;line-height:1}
nav button.sel{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stat{background:var(--panel2);border-radius:10px;padding:10px}.stat .v{font-size:22px;font-weight:600}.stat .k{color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .nm{flex:1;min-width:0}.it .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm span{color:var(--dim);font-size:12px}
.tap{cursor:pointer}.tap:active{background:var(--panel2)}
input,textarea,select{width:100%;background:#0f0c09;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;min-height:50vh}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 4px}
button.b{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer}
button.b:active{transform:translateY(1px)}
button.p{background:var(--gold);color:#1a1208;border-color:var(--gold);font-weight:600}
button.d{border-color:#6a2a22;color:#ffb0a6}
button.s{padding:6px 10px;font-size:13px}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.on{background:#1f3a24;color:var(--good)}.pill.ban{background:#3a1f1c;color:var(--bad)}
.heroes{display:grid;grid-template-columns:1fr 70px 90px 60px;gap:6px;align-items:center}
.heroes .h{font-size:13px}.heroes input{padding:7px}
.muted{color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2418;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:10px;z-index:9;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.log{font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow:auto;background:#0f0c09;padding:8px;border-radius:8px}
.login{max-width:420px;margin:12vh auto 0;padding:0 16px}
.login h1{text-align:center;color:var(--gold);font-size:26px;margin-bottom:4px}
.back{background:none;border:0;color:var(--gold);font-size:22px;padding:0 6px 0 0;cursor:pointer}
.hide{display:none!important}
.vw table{width:100%;border-collapse:collapse;font-size:13px}.vw td,.vw th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.vw th{color:var(--dim);font-weight:500}
.r-common{color:#c8c0b0}.r-uncommon{color:#7ccf8a}.r-rare{color:#6fb0ff}.r-epic{color:#c58cff}.r-legendary{color:#ffa94a}.r-relic{color:#ffa94a}.r-cursed{color:#ff6a5a}
.warn{border-color:#8a2f25!important;background:#2a1612}
.term{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#0b0907;color:#d8f0c8;padding:10px;border-radius:8px;min-height:180px;max-height:55vh;overflow:auto}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.qgrid .b{text-align:left;font-size:13px}
</style>
</head>
<body>
<div id="login" class="login hide">
  <h1>⚜ Vigilfall Admin</h1>
  <p class="muted" style="text-align:center">Manage your Realm server</p>
  <label>Server address</label><input id="lsrv" placeholder="myrealm.duckdns.org" autocapitalize="off" autocorrect="off">
  <label>Admin password</label><input id="lpw" type="password" placeholder="password">
  <p id="lerr" style="color:var(--bad);min-height:1.4em"></p>
  <button class="b p" id="lgo" style="width:100%">Connect</button>
  <p class="muted" style="margin-top:18px">The password is in <b>data/config.json</b> on the server (the setup script also prints it).</p>
  <p class="muted" style="text-align:center;margin-top:14px">New phone? <a href="#" id="lrestore" style="color:var(--gold)">Restore an app backup…</a></p>
  <div id="lrbox" class="hide"></div>
</div>
<div id="app" class="hide">
  <header><button class="back hide" id="hback">‹</button><span class="dot" id="hdot"></span><h1 id="htitle">Realm</h1><button class="b s" id="hout" title="Sign out">⎋</button></header>
  <main id="main"></main>
  <nav>
    <button data-t="dash" class="sel"><b>◈</b>Dashboard</button>
    <button data-t="players"><b>☺</b>Players</button>
    <button data-t="msg"><b>✉</b>Message</button>
    <button data-t="backup"><b>⛁</b>Backups</button>
    <button data-t="con"><b>›_</b>Console</button>
    <button data-t="server"><b>⚙</b>Server</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const HERO = { templar: "Ser Aldric", warden: "Morrow", colossus: "Gravemaw", cleric: "Sister Ysolde", druid: "Hollin Thorne", apothecary: "Doctor Vesh", witch: "Cinder Maeve", ranger: "Wren Ashby", assassin: "Nyx" };
const heroName = (id) => HERO[id] || String(id || "").replace(/(^|_)(\w)/g, (a, b, c) => (b ? " " : "") + c.toUpperCase());
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ago = (t) => { if (!t) return "never"; const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago"; };
const dur = (s) => { s = Math.round(s); const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
const mb = (b) => (b / 1048576).toFixed(0) + " MB";
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2600); };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };

const norm = (s) => { s = String(s || "").trim().replace(/\/+$/, ""); if (!s) return ""; if (!/^https?:\/\//i.test(s)) s = (/^(\d+\.){3}\d+(:\d+)?$|localhost/.test(s) ? "http://" : "https://") + s; return s.replace(/\/(admin|realm)$/, ""); };
const IN_APP = /VigilfallAdmin/.test(navigator.userAgent);
// the app downloads this page from GitHub by itself; APP_LATEST is the newest app shell (asks to install it when older)
const PAGE_VERSION = "1.19";
const APP_LATEST = "1.9";
let APP_URL = "https://github.com/polemarxos/Vigilfall/raw/main/VigilfallAdmin.apk";
const APP_VER = (navigator.userAgent.match(/VigilfallAdmin\/([\d.]+)/) || [])[1] || "";
const older = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); } return false; };
let pendingReload = false;
// app self-update (app 1.4+): downloads the new APK and opens Android's installer by itself
const SELF = !!(window.VFAApp && window.VFAApp.canSelfUpdate);
let updState = "", updDetail = "";
const needsApp = () => IN_APP && APP_VER && older(APP_VER, APP_LATEST);
const startAppUpdate = () => { if (!SELF) return; updState = "starting"; updDetail = ""; try { window.VFAApp.selfUpdate(APP_URL); } catch (e) { updState = "failed"; updDetail = String(e); } drawUpd(); };
window.VFA_updateState = (st, d) => { updState = st; updDetail = d || ""; drawUpd(); };
window.VFA_resume = () => { if (updState === "permission" && needsApp()) startAppUpdate(); };
const updText = () => ({
  "": "A new version is available.", starting: "Starting the download…", downloading: `Downloading… ${updDetail}%`,
  installing: `Android will ask you to tap <b>Install</b> (version ${esc(updDetail)}).`,
  permission: "Allow <b>Install unknown apps</b> for Vigilfall Admin in the screen that opened, then come back — the update continues by itself.",
  confirm: "Tap <b>Update</b> in Android's window to finish.",
  failed: `The update did not work: ${esc(updDetail)}. Try again or use Download.`, current: "You already have the newest app.",
})[updState] || "";
function updCard() {
  if (!needsApp()) return "";
  return `<div class="card" id="updcard" style="border-color:var(--gold)"><b>New Vigilfall Admin app ${APP_LATEST}</b><p class="muted" id="updtxt">You have ${esc(APP_VER)}. ${SELF ? updText() : "Install the new version once (it keeps your login); from then on the app updates itself."}</p><div class="row">${SELF ? '<button class="b p" id="updgo">Update now</button>' : ""}<a class="b ${SELF ? "" : "p"}" style="display:inline-block;text-decoration:none" href="${APP_URL}">Download</a></div></div>`;
}
function drawUpd() { const t = document.getElementById("updtxt"); if (t) t.innerHTML = `You have ${esc(APP_VER)}. ${updText()}`; }
let updAuto = false;
window.VFA_updated = () => { if (!stack.length && (tab === "dash" || !$("#app") || $("#app").classList.contains("hide"))) location.reload(); else { pendingReload = true; toast("Admin update downloaded — it applies on the Dashboard"); } };
let S = { base: store.get("vfa_srv") || (!IN_APP && location.protocol.startsWith("http") ? location.origin : ""), pw: store.get("vfa_pw") || "" };

async function call(path, method = "GET", body) {
  const r = await fetch(S.base + "/api/" + path, { method, headers: { Authorization: "Bearer " + S.pw, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || "HTTP " + r.status); err.code = r.status; throw err; }
  return j;
}

// ---------------- login ----------------
function loginRestore() {
  const box = $("#lrbox"); box.classList.remove("hide");
  box.innerHTML = appBackupCard().replace(/<h2>Back up this app<\/h2>/, "<h2>Restore an app backup</h2>");
  appBackupWire();
  $("#abmake").classList.add("hide");
}
function showLogin(msg) {
  $("#lrestore") && ($("#lrestore").onclick = (e) => (e.preventDefault(), loginRestore()));
  $("#app").classList.add("hide"); $("#login").classList.remove("hide");
  $("#lsrv").value = S.base.replace(/^https?:\/\//, ""); $("#lpw").value = ""; $("#lerr").textContent = msg || "";
}
$("#lgo").onclick = async () => {
  S.base = norm($("#lsrv").value); S.pw = $("#lpw").value;
  if (!S.base) return ($("#lerr").textContent = "Enter the server address.");
  $("#lerr").textContent = "Connecting…";
  try { await call("status"); store.set("vfa_srv", S.base); store.set("vfa_pw", S.pw); start(); }
  catch (e) { $("#lerr").textContent = e.code === 401 ? "Wrong password." : e.message === "Failed to fetch" ? "Could not reach the server." : e.message; }
};
$("#lpw").onkeydown = (e) => e.key === "Enter" && $("#lgo").click();
$("#hout").onclick = () => { if (confirm("Sign out of this server?")) { store.del("vfa_pw"); S.pw = ""; showLogin(); } };

// ---------------- navigation ----------------
let tab = "dash", timer = null, stack = [];
function go(t) {
  if (pendingReload && t === "dash") return location.reload();
  tab = t; stack = [];
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("sel", b.dataset.t === t));
  render();
}
document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => go(b.dataset.t)));
$("#hback").onclick = () => back();
function push(fn) { stack.push(fn); fn(); $("#hback").classList.remove("hide"); }
function back() { stack.pop(); stack.length ? stack[stack.length - 1]() : render(); }
window.VFA_back = () => { if (stack.length) { back(); return true; } if (tab !== "dash") { go("dash"); return true; } return false; };
function render() {
  clearInterval(timer); $("#hback").classList.add("hide");
  ({ dash, players, msg, backup: fullBackups, con: consoleTab, server })[tab]();
}
const M = () => $("#main");
const fail = (e) => { if (e.code === 401) return showLogin("The password changed — sign in again."); toast("⚠ " + e.message); };

// ---------------- dashboard ----------------
let lastStatus = null;
// ---------------- live: map of who is where, chat, message / mute / kick ----------------
async function live() {
  $("#htitle").textContent = "Live";
  M().innerHTML = `<div class="card"><h2>Map</h2><canvas id="lmap" width="700" height="700" style="width:100%;max-width:520px;aspect-ratio:1;display:block;margin:0 auto;background:#0f0c09;border-radius:10px"></canvas><p class="muted" id="lmapn" style="text-align:center"></p></div>
    <div class="card"><h2>Online</h2><div class="list" id="lon"><div class="muted">Loading…</div></div></div>
    <div class="card"><h2>Chat</h2><div class="row" style="gap:8px;margin-bottom:8px"><input id="lq" placeholder="Search the chat" style="flex:1"></div><div class="log" id="lchat" style="max-height:45vh">…</div></div>
    <div class="card"><h2>Muted</h2><div class="list" id="lmut"></div></div>`;
  let data = null;
  const fmtT = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const drawMap = () => {
    const c = $("#lmap"); if (!c || !data) return;
    const g = c.getContext("2d"), W = c.width, pts = [...data.places.map((q) => [q.x, q.z]), ...data.online.filter((o) => o.pos).map((o) => o.pos)];
    const R = Math.max(300, ...pts.map(([x, z]) => Math.hypot(x, z))) * 1.08, sc = W / 2 / R, P = (x, z) => [W / 2 + x * sc, W / 2 + z * sc];
    g.clearRect(0, 0, W, W);
    g.strokeStyle = "#3a3226"; g.lineWidth = 2; g.beginPath(); g.arc(W / 2, W / 2, (R / 1.08) * sc, 0, 7); g.stroke();
    g.font = "18px system-ui"; g.textAlign = "center";
    for (const q of data.places) { const [x, y] = P(q.x, q.z); g.fillStyle = q.k === "port" ? "#c9a96a" : "#8a7a5a"; g.fillRect(x - 4, y - 4, 8, 8); g.fillStyle = "#a89a80"; g.textAlign = x > W - 90 ? "right" : x < 90 ? "left" : "center"; g.fillText(q.n, x, y - 9); g.textAlign = "center"; }
    g.font = "bold 20px system-ui";
    for (const o of data.online.filter((o) => o.pos)) { const [x, y] = P(o.pos[0], o.pos[1]); g.fillStyle = "#7fe07f"; g.beginPath(); g.arc(x, y, 8, 0, 7); g.fill(); g.fillStyle = "#e8ffe8"; g.fillText(o.name || o.pid, x, y + 28); }
    $("#lmapn").textContent = data.places.length ? `${data.online.length} online · squares are towns and camps` : "Towns appear on the map after the world restarts once with game 1.26.";
  };
  const draw = () => {
    if (!data || !$("#lon")) return;
    drawMap();
    const L = $("#lon"); L.innerHTML = data.online.length ? "" : '<div class="muted">Nobody is in the Realm.</div>';
    for (const o of data.online) {
      const d = document.createElement("div"); d.className = "it";
      const mu = data.mutes[o.pid];
      d.innerHTML = `<div class="nm"><b>${esc(o.name || o.pid)}</b><span>Lv ${o.lv || "?"} · ${esc(o.hero || "")} · ${o.since ? "online " + dur((Date.now() - o.since) / 1000) : ""}${mu ? " · 🔇 muted" : ""}</span></div><button class="b s" data-m>✉</button><button class="b s" data-u>${mu ? "🔊" : "🔇"}</button><button class="b s d" data-k>Kick</button>`;
      d.querySelector(".nm").onclick = () => push(() => player(o.pid));
      d.querySelector("[data-m]").onclick = async () => { const t = prompt(`Message to ${o.name} (only they see it):`, ""); if (!t) return; try { await call("dm", "POST", { pid: o.pid, text: t }); toast("Sent"); load(); } catch (e) { fail(e); } };
      d.querySelector("[data-u]").onclick = () => muteDialog(o.pid, o.name, !!mu).then(load);
      d.querySelector("[data-k]").onclick = async () => { const why = prompt("Reason (shown to the player):", "Removed by an admin."); if (why === null) return; try { await call(`players/${o.pid}/kick`, "POST", { why }); toast("Kicked"); load(); } catch (e) { fail(e); } };
      L.appendChild(d);
    }
    const q = ($("#lq")?.value || "").toLowerCase();
    const C = $("#lchat"), atBottom = C.scrollTop + C.clientHeight >= C.scrollHeight - 30;
    const rows = data.chat.filter((m) => !q || (m.name + " " + m.text).toLowerCase().includes(q));
    C.innerHTML = rows.length ? rows.map((m) => `<div><span class="muted">${fmtT(m.at)}</span> <b style="color:${m.admin ? "var(--gold)" : "#9fd0ff"};cursor:pointer" data-pid="${esc(m.pid)}" data-n="${esc(m.name)}">${esc(m.name)}</b>: ${esc(m.text)}</div>`).join("") : '<span class="muted">No chat yet (the chat is kept until the server restarts).</span>';
    C.querySelectorAll("[data-pid]").forEach((b) => (b.onclick = () => { const mu = !!data.mutes[b.dataset.pid]; if (confirm(`${b.dataset.n}: ${mu ? "unmute" : "mute"} this player?`)) muteDialog(b.dataset.pid, b.dataset.n, mu).then(load); }));
    if (atBottom) C.scrollTop = C.scrollHeight;
    const MU = $("#lmut"), ms = Object.entries(data.mutes);
    MU.innerHTML = ms.length ? "" : '<div class="muted">Nobody is muted.</div>';
    for (const [pid, m] of ms) {
      const d = document.createElement("div"); d.className = "it";
      d.innerHTML = `<div class="nm"><b>${esc(m.name || pid)}</b><span>${m.until ? "until " + new Date(m.until).toLocaleString() : "until unmuted"}${m.why ? " · " + esc(m.why) : ""}</span></div><button class="b s">Unmute</button>`;
      d.querySelector("button").onclick = async () => { try { await call("mute", "POST", { pid, off: true }); toast("Unmuted"); load(); } catch (e) { fail(e); } };
      MU.appendChild(d);
    }
  };
  const load = async () => { try { data = await call("live"); draw(); } catch (e) { fail(e); } };
  $("#lq").oninput = draw;
  await load();
  clearInterval(timer);
  timer = setInterval(() => { if (!$("#lmap")) return clearInterval(timer); load(); }, 5000);
}
async function muteDialog(pid, name, isMuted) {
  try {
    if (isMuted) { await call("mute", "POST", { pid, off: true }); return toast("Unmuted"); }
    const h = prompt(`Mute ${name} — for how many hours? (0 = until you unmute)`, "1"); if (h === null) return;
    const why = prompt("Reason (shown to the player, optional):", "") ?? "";
    await call("mute", "POST", { pid, name, minutes: Math.round(+h * 60), why }); toast("Muted");
  } catch (e) { fail(e); }
}
async function dash() {
  M().innerHTML = `<div class="muted">Loading…</div>`;
  const draw = async () => {
    if (tab !== "dash" || stack.length) return;
    let s;
    try { s = await call("status"); } catch (e) { $("#hdot").className = "dot off"; return fail(e); }
    lastStatus = s;
    $("#htitle").textContent = s.name; $("#hdot").className = "dot " + (s.hostReady ? "on" : "off");
    const w = s.world || {};
    const memUsed = s.mem.total - s.mem.free;
    M().innerHTML = `${updCard()}
${s.maintenance ? `<div class="card warn"><b>Maintenance mode is ON</b><p class="muted">Nobody can enter the Realm. Turn it off under Message.</p></div>` : ""}
      <div class="card"><h2>World</h2><div class="grid">
        <div class="stat"><div class="v" style="color:${s.hostReady ? "var(--good)" : "var(--bad)"}">${s.hostReady ? "Online" : s.hostUp ? "Starting…" : "Down"}</div><div class="k">${s.hostReady ? (w.sleeping ? "resting — nobody online" : "running " + dur((Date.now() - s.hostSince) / 1000)) : "world host"}</div></div>
        <div class="stat"><div class="v">${s.online.length}<span class="muted"> / ${s.maxPlayers}</span></div><div class="k">players online</div></div>

const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
async function aesKey(pass, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function appBackupMake(pass, withServer) {
  let serverPack = null;
  if (withServer) {
    const x = await call("fullbackups/complete", "POST", { pass });
    const r = await fetch(S.base + x.url, { cache: "no-store" });
    if (!r.ok) throw new Error("Could not fetch the complete server backup (HTTP " + r.status + ").");
    serverPack = { file: x.file, server: S.base, data: b64(new Uint8Array(await r.arrayBuffer())) };
  }
  const ls = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); /^vfa_/.test(k) && (ls[k] = localStorage.getItem(k)); }
  let native = {};
  try { native = JSON.parse(window.VFAApp?.exportData?.() || "{}"); } catch (e) {}
  const data = JSON.stringify({ kind: "vigilfall-admin-backup", v: 2, at: Date.now(), app: APP_VER, page: PAGE_VERSION, ls, native, serverPack });
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await aesKey(pass, salt), new TextEncoder().encode(data)));
  return JSON.stringify({ vigilfallAdminBackup: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) });
}
async function appBackupOpen(text, pass) {
  let o;
  try { o = JSON.parse(text); } catch (e) { throw new Error("That is not a Vigilfall Admin backup file."); }
  if (!o.vigilfallAdminBackup) throw new Error("That is not a Vigilfall Admin backup file.");
  let pt;
  try { pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, await aesKey(pass, unb64(o.salt)), unb64(o.data)); }
  catch (e) { throw new Error("Wrong password (or the file is damaged)."); }
  return JSON.parse(new TextDecoder().decode(pt));
}
function saveText(name, text) {

  document.body.appendChild(a); a.click(); setTimeout(() => (URL.revokeObjectURL(a.href), a.remove()), 1000);

}

}
async function saveProfile(pid, np, name) {

const QUICK = [

  ["Reboot server", "sudo reboot", "Reboot the whole server? Both games are offline for 2–3 minutes."],
];
let conRun = null;
const conHost = () => store.get("vfa_sshhost") || S.base.replace(/^https?:\/\//, "").replace(/[:/].*$/, "");
const conUser = () => store.get("vfa_sshuser") || "ubuntu";
window.VFA_sshOut = (id, chunk) => {
  if (!conRun || conRun.id !== id) return;
  conRun.text = (conRun.text + chunk).slice(-200000);
  const o = $("#cout");
  if (o) { o.textContent = conRun.text; o.scrollTop = o.scrollHeight; }
};
window.VFA_sshDone = (id, code) => {
  if (!conRun || conRun.id !== id) return;
  VFA_sshOut(id, `\n— finished${code >= 0 ? " (exit " + code + ")" : ""} —\n`);
  conRun.busy = false;
  const b = $("#crun"), x = $("#cstop"); b && (b.disabled = false); x && x.classList.add("hide");
};
function conExec(cmd, ask) {
  if (!window.VFAApp) return;
  if (ask && !confirm(ask)) return;
  if (conRun?.busy) return toast("A command is still running — Stop it first");
  if (!VFAApp.hasKey()) return toast("Choose your SSH key first");
  // the server's own copy of the setup (works with a private repository: it reuses the saved read token)
  // always the newest setup from GitHub (an old copy on the server could be outdated)
  if (cmd === "@setup") cmd = `curl -fsSL 'https://raw.githubusercontent.com/polemarxos/Vigilfall/main/server/setup.sh?t=${Date.now()}' | sudo VF_NONINTERACTIVE=1 VF_DOMAIN=${S.base.replace(/^https?:\/\//, "").replace(/[:/].*$/, "")} bash`;
  const id = "c" + Date.now();
  conRun = { id, busy: true, text: `$ ${cmd}\n` };
  if (!/VF_RESTORE_PASS|VF_.*TOKEN/.test(cmd)) {
    const hist = JSON.parse(store.get("vfa_hist") || "[]").filter((h) => h !== cmd);
    hist.unshift(cmd); store.set("vfa_hist", JSON.stringify(hist.slice(0, 20)));
  } else conRun.text = "$ (setup with your restore link — not kept in the history)\n";
  const o = $("#cout"); o && (o.textContent = conRun.text);
  const b = $("#crun"), x = $("#cstop"); b && (b.disabled = true); x && x.classList.remove("hide");
  VFAApp.exec(id, conHost(), conUser(), cmd);
}

      <p class="muted">Runs as one command on the server (sudo works). Programs that need a full screen or ask questions (nano, top, y/n prompts) do not work here — add -y or use Termux for those.</p>
      <div class="term" id="cout">${esc(conRun?.text || "")}</div></div>`;
  const save = () => { store.set("vfa_sshhost", $("#chost").value.trim()); store.set("vfa_sshuser", $("#cuser").value.trim() || "ubuntu"); };
  $("#chost").onchange = save; $("#cuser").onchange = save;

  $("#crun").onclick = () => { save(); const c = $("#ccmd").value.trim(); c && conExec(c); };

}

      // also take the Realm's name out of a shared DuckDNS updater (e.g. domains=wsgame,vigilfall), so only the new server updates it
      const host = S.base.replace(/^https?:\/\//, "").replace(/[:/].*$/, ""), sub = /\.duckdns\.org$/.test(host) ? host.replace(/\.duckdns\.org$/, "") : "";
      const off = "sudo systemctl disable --now vigilfall-realm && sudo rm -f /etc/cron.d/vigilfall-duckdns" + (sub ? ` && (sudo sed -i -e 's/,${sub}&/\\&/' -e 's/=${sub},/=/' -e 's/,${sub},/,/' /etc/cron.d/duckdns 2>/dev/null; true)` : "") + " && echo 'Old Realm switched off'";
      $("#cmoveout").innerHTML = `<ol class="muted" style="padding-left:18px">
        <li>Make the new server (Ubuntu 22.04 or 24.04) and open ports 80 and 443 on it.</li>
        <li>Run this <b>one line on the new server</b> (it works once, for 2 hours). It installs everything and brings over all players, settings, passwords and keys, and the same address:
          <textarea id="cmvcmd" readonly rows="6" style="width:100%;height:auto;min-height:0;font:12px monospace;margin-top:6px">${esc(cmd)}</textarea>
          <div class="row"><button class="b s" id="cmvcopy">Copy</button>${window.VFAApp?.exec ? '<button class="b s" id="cmvrun">Run it from the Console…</button>' : ""}</div></li>
        <li>When it says "Everything from the old server is here", switch off the Realm on this <b>old</b> server, so the address moves to the new one within 5 minutes (the other game on this server is not touched):
          <textarea readonly rows="4" style="width:100%;height:auto;min-height:0;font:12px monospace;margin-top:6px">${esc(off)}</textarea>
          <div class="row"><button class="b s" id="cmvcopy2">Copy</button>${window.VFAApp?.exec ? '<button class="b s d" id="cmvoff">Switch off the old Realm now…</button>' : ""}</div></li>
        <li>This app keeps working with the same address and admin password.</li></ol>`;
      const copy = (t) => (navigator.clipboard?.writeText(t).then(() => toast("Copied"), () => toast("Select and copy the text")) ?? toast("Select and copy the text"));
      $("#cmvcopy").onclick = () => copy(cmd);
      $("#cmvcopy2").onclick = () => copy(off);
      $("#cmvrun") && ($("#cmvrun").onclick = () => {
        const h = prompt("Address (IP) of the NEW server:", ""); if (!h) return;
        const u = prompt("User name on the new server:", conUser()) || "ubuntu";
        store.set("vfa_sshhost", h.trim()); store.set("vfa_sshuser", u.trim());
        go("con"); setTimeout(() => conExec(cmd), 300);
      });
      $("#cmvoff") && ($("#cmvoff").onclick = () => {
        const h = prompt("Address (IP) of the OLD server (this one):", S.base.replace(/^https?:\/\//, "").replace(/[:/].*$/, "")); if (!h) return;
        store.set("vfa_sshhost", h.trim());
        go("con"); setTimeout(() => conExec(off, "Switch off the Realm on " + h + "? Only do this after the new server is ready."), 300);
      });
    } catch (e) { fail(e); }
  };
  $("#fbnow").onclick = async () => { toast("Backing up…"); try { await call("fullbackups", "POST"); toast("Server backed up"); fullBackups(); } catch (e) { fail(e); } };
  $("#fbsave").onclick = async () => { try { await call("config", "POST", { autoBackupHours: +$("#fbh").value, autoBackupKeep: +$("#fbk").value }); toast("Saved"); fullBackups(); } catch (e) { fail(e); } };
  $("#fbup").onclick = () => $("#fbfile").click();
  $("#fbfile").onchange = async () => {
    let f = $("#fbfile").files[0]; if (!f) return;
    let packPass = "";
    // a "back up everything" file from this app: take the complete server backup out of it
    if (/\.vfadmin$/i.test(f.name) || (f.size < 200e6 && (await f.slice(0, 40).text()).includes("vigilfallAdminBackup"))) {
      packPass = prompt("Password of this backup file:") || ""; if (!packPass) return;
      try {
        const o = await appBackupOpen(await f.text(), packPass);
        if (!o.serverPack) return toast("This backup file has no server backup inside (it was made with the box unticked).");
        f = new Blob([unb64(o.serverPack.data)]);
      } catch (e) { return fail(e); }
    }
    toast(`Uploading ${kb(f.size)}…`);
    try {
      const res = await fetch(S.base + "/api/fullbackups/upload", { method: "POST", headers: { Authorization: "Bearer " + S.pw, "Content-Type": "application/gzip" }, body: f });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(j.error || "HTTP " + res.status), { code: res.status });
      if (j.complete && packPass && confirm("Restore EVERYTHING from it now (players, settings, passwords, keys)? A normal backup of the current state is made first and the Realm restarts.")) {
        try { await call(`fullbackups/${encodeURIComponent(j.file)}/restore`, "POST", { pass: packPass }); alert("Restored. The Realm restarts now. Sign in with the admin password from the backup."); store.del("vfa_pw"); S.pw = ""; return showLogin("The Realm is restarting from the backup. Sign in in a minute."); } catch (e) { return fail(e); }
      }
      toast(j.complete ? "Uploaded a complete backup — press Restore on it and type its password" : "Uploaded — press Restore on it to use it"); fullBackups();
    } catch (e) { fail(e); }
  };
}

function start() {
  try { window.VFAApp?.setServer?.(S.base); } catch (e) {}
  // keep the phone alerts pointed at this server with the current password
  try { if (window.VFAApp?.setAlerts) { const a = JSON.parse(VFAApp.getAlerts() || "{}"); a.on && VFAApp.setAlerts(JSON.stringify({ on: true, kinds: a.kinds, base: S.base, pw: S.pw })); } } catch (e) {} $("#login").classList.add("hide"); $("#app").classList.remove("hide"); go("dash"); }
(async () => {
  if (!S.base || !S.pw) return showLogin();
  try { await call("status"); start(); } catch (e) { showLogin(e.code === 401 ? "Sign in again." : e.message === "Failed to fetch" ? "Could not reach " + S.base.replace(/^https?:\/\//, "") : e.message); }
})();
</script>
</body>
</html>
